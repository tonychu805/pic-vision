name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://api.moonshot.ai/v1
          OPENWIKI_MODEL_ID: kimi-k3
          LANGCHAIN_TRACING_V2: "false"

      - name: Commit and push OpenWiki update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openwiki AGENTS.md CLAUDE.md .github/workflows/openwiki-update.yml
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: update OpenWiki"
            git push
          fi
