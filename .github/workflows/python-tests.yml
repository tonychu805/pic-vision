# The Python suite is a merge gate. It intentionally runs on every proposed
# change, including documentation-only PRs: a required check that does not
# report on some PRs cannot reliably protect `main`.
name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The clip-cutting and framing tests make a few seconds of synthetic
      # video with ffmpeg, as the pod does for real (2026-10-28).
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run Python tests
        run: make test
      # Dependency vulnerability gate. Audits the environment just installed
      # from requirements.txt (reusing the install -- no second resolve of the
      # torch/opencv tree), so it checks the exact versions the suite ran on.
      # Scope is the deps this repo tracks (see sbom/VULNERABILITIES.md); fails
      # the job on ANY known vulnerability. When a transitive CVE has no
      # in-range fix and is consciously accepted, waive that one id with
      # `--ignore-vuln <ID>` and a note here -- never by deleting this gate.
      # pip-audit and its own deps land in this env too, so an advisory in the
      # scanner itself can surface here; waive it the same explicit way.
      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit
