# The Python suite is a merge gate. It intentionally runs on every proposed
# change, including documentation-only PRs: a required check that does not
# report on some PRs cannot reliably protect `main`.
name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run Python tests
        run: make test
