# Builds the venue-facing desktop agent as an unsigned macOS DMG (PIC-84,
# ADR-084) and attaches it to a GitHub Release.
#
# Apple silicon only (operator's call, 2026-09-07). Intel Macs are not
# supported: every Mac sold since late 2020 is arm64, and a venue capture
# box is bought for the job rather than inherited. A venue that already
# owns an Intel Mac can't run this -- re-adding `x64` to the matrix below
# is all it takes if that changes.
#
# The matrix is kept for one entry precisely so that stays a one-line
# change, and because ffmpeg-static downloads only the architecture it was
# installed for -- any second arch needs its own `npm ci` with
# npm_config_arch set, not a shared one.
#
# package.json's build.mac.target must NOT list `arch`: electron-builder
# builds every arch named there regardless of the flag passed here. It did
# until 2026-09-07, so each leg built both DMGs and the arm64 runner packed
# its arm64 ffmpeg into an x64 installer -- broken on a real Intel Mac, and
# visible only by reading the build log.
#
# Signing is deliberately off (CSC_IDENTITY_AUTO_DISCOVERY=false, and
# build.mac.identity is null in package.json) until an Apple Developer
# membership exists -- see desktop/README.md's install section for what
# that costs the person installing it.
name: Build desktop (macOS)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The tag is what names the release; package.json is what the built
      # app reports as its own version and what the update check compares
      # against. If they disagree, the release says 1.2.0 while every copy
      # of it calls itself 1.1.0 -- so the update check tells those users
      # they're behind forever, and nothing anywhere looks broken.
      # `npm version` (see desktop/.npmrc) keeps them in step; this is the
      # guard for when someone tags by hand instead.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag desktop-v$TAG_VERSION does not match package.json $PKG_VERSION."
            echo "::error::Use 'npm version <patch|minor|major>' in desktop/ instead of tagging by hand."
            exit 1
          fi

      - name: Install dependencies for ${{ matrix.arch }}
        working-directory: desktop
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm ci

      - name: Build ${{ matrix.arch }} DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build -- --mac --${{ matrix.arch }}

      - name: Check the bundle carries its runtime dependencies
        working-directory: desktop
        run: |
          APP=$(find release -maxdepth 2 -name "*.app" -print -quit)
          echo "checking $APP"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" > /tmp/asar.txt
          for pkg in electron-store onvif oui-data posthog-node; do
            grep -q "node_modules/$pkg/" /tmp/asar.txt || { echo "MISSING $pkg in asar"; exit 1; }
          done
          # ffmpeg/ffprobe must be OUTSIDE the asar to be executable at all.
          test -x "$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg" \
            || { echo "ffmpeg not unpacked/executable"; exit 1; }
          echo "bundle checks passed"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: desktop/release/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
          body: |
            Unsigned macOS build. On first launch macOS will refuse to open it:
            open it once, then System Settings → Privacy & Security → **Open Anyway**.
            See `desktop/README.md` for details.
