<!doctype html>
<html><head><meta charset="utf-8"><title>pic-vision</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  .wrap { max-width: 640px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  p.sub { color: #999; }
  label { display: block; margin: 18px 0 6px; font-size: 14px; color: #aaa; }
  input[type=file], input[type=number] {
    font-size: 15px; padding: 8px; width: 100%; box-sizing: border-box;
    background: #1a1a1a; color: #eee; border: 1px solid #333;
  }
  button {
    font-size: 16px; padding: 10px 20px; margin-top: 24px; background: #2a6;
    color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .warn { background: #532; padding: 10px 14px; border-radius: 4px; margin-top: 16px; color: #fca; }
</style></head>
<body>
<div class="wrap">
  <h1>pic-vision — rally highlight reel</h1>
  <p class="sub">Upload footage, calibrate the court, then wait for the reel.</p>
  {% if busy %}
  <div class="warn">A job is already running — wait for it to finish before starting a new one.</div>
  {% endif %}
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label>Video file</label>
    <input type="file" name="video" accept="video/*" required {{ 'disabled' if busy }}>
    <label>Reel length (seconds)</label>
    <input type="number" name="target_sec" value="{{ default_target_sec }}" min="30" step="10" {{ 'disabled' if busy }}>
    <button type="submit" {{ 'disabled' if busy }}>Upload &amp; calibrate</button>
  </form>
</div>
</body></html>
