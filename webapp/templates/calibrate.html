<!doctype html>
<html><head><meta charset="utf-8"><title>calibrate</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  #bar { padding: 10px 14px; background: #1a1a1a; position: sticky; top: 0; display: flex;
         align-items: center; flex-wrap: wrap; gap: 16px; }
  #msg { font-size: 16px; }
  #wrap { position: relative; display: inline-block; }
  img { display: block; max-width: 100vw; height: auto; }
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  circle { fill: #0f0; }
  circle.net { fill: #f33; }
  text { fill: #ff0; font-size: 14px; font-weight: bold; }
  button { font-size: 15px; padding: 6px 14px; cursor: pointer; }
  input[type=number] { width: 80px; font-size: 14px; padding: 4px; }
  #status { font-size: 13px; color: #aaa; width: 100%; }
  .reframe { font-size: 13px; color: #ccc; }
</style></head>
<body>
<div id="bar">
  <div id="msg">Click: <b id="label"></b></div>
  <button onclick="undo()">Undo (u)</button>
  <button onclick="resetAll()">Reset (r)</button>
  <button id="save" onclick="save()" disabled>Save</button>
  <span class="reframe">
    frame at <input type="number" id="atInput" value="{{ at }}" step="1" min="0" max="{{ duration_int }}"> s
    (video is {{ duration_int }}s long)
    <button onclick="reload()">Reload frame</button>
  </span>
  <div id="status"></div>
</div>
<div id="wrap">
  <img id="img" src="data:image/png;base64,{{ frame_b64 }}">
  <svg id="ov" viewBox="0 0 {{ w }} {{ h }}"></svg>
</div>
<script>
const labels = {{ labels|safe }};
const nCourt = {{ n_court }};
const total = labels.length;
const AT = {{ at }};
let points = [];
const img = document.getElementById('img');
const ov = document.getElementById('ov');
const labelEl = document.getElementById('label');
const statusEl = document.getElementById('status');
const saveBtn = document.getElementById('save');

function render() {
  labelEl.textContent = points.length < total ? labels[points.length] : "ALL PLACED - press Save";
  ov.innerHTML = '';
  points.forEach((p, i) => {
    const net = i >= nCourt;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 6);
    c.setAttribute('class', net ? 'net' : '');
    ov.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p[0] + 9); t.setAttribute('y', p[1] - 9);
    t.textContent = net ? 'N' + (i - nCourt + 1) : String(i + 1);
    ov.appendChild(t);
  });
  statusEl.textContent = points.length + ' / ' + total + ' placed';
  saveBtn.disabled = points.length !== total;
}

img.addEventListener('click', (e) => {
  if (points.length >= total) return;
  const r = img.getBoundingClientRect();
  const scale = {{ w }} / r.width;
  const x = (e.clientX - r.left) * scale;
  const y = (e.clientY - r.top) * scale;
  points.push([x, y]);
  render();
});

function undo() { points.pop(); render(); }
function resetAll() { points = []; render(); }

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'u') undo();
  if (e.key === 'r') resetAll();
});

function reload() {
  const at = document.getElementById('atInput').value;
  window.location = '{{ reload_url }}?at=' + encodeURIComponent(at);
}

function save() {
  statusEl.textContent = 'saving...';
  fetch('{{ save_url }}', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({points, at: AT})
  }).then(r => r.json()).then(d => {
    if (d.error) { statusEl.textContent = 'ERROR: ' + d.error; return; }
    statusEl.textContent = 'saved, RMSE = ' + d.rmse_ft.toFixed(3) + ' ft'
      + (d.rmse_ft > 0.5 ? '  (WARNING: re-check points, worst = ' + d.worst + ')' : '  (looks good)')
      + ' -- starting pipeline...';
    setTimeout(() => { window.location = d.redirect; }, 1200);
  });
}
render();
</script>
</body></html>
